<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng • ProxVN Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .users-table th,
        .users-table td {
            text-align: left;
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-border);
        }

        .users-table th {
            color: var(--color-text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            background-color: rgba(255, 255, 255, 0.01);
        }

        .badge-role {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-admin {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-user {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .actions-cell {
            text-align: right;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.82rem;
            border-radius: var(--radius-sm);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(5, 13, 31, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            width: min(480px, 90%);
            background-color: #0b0f19;
            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 32px;
            animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalIn {
            from { transform: scale(0.9) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-card h3 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(5, 10, 20, 0.4);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-indigo);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }
    </style>
</head>

<body>
    <div class="background-layer">
        <div class="gradient gradient-primary"></div>
        <div class="gradient gradient-accent"></div>
    </div>

    <!-- Command Palette Overlay -->
    <div class="cmd-palette-overlay" id="cmdPalette" style="display:none;" role="dialog" aria-modal="true" aria-label="Command Palette">
        <div class="cmd-palette">
            <div class="cmd-palette-search">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="cmdSearchInput" placeholder="Tìm kiếm trang hoặc lệnh nhanh... (Ctrl+K)" autocomplete="off">
            </div>
            <div class="cmd-palette-results" id="cmdResults"></div>
            <div class="cmd-palette-footer">
                <span>Di chuyển bằng ↑↓, Chọn bằng Enter, Đóng bằng Esc</span>
            </div>
        </div>
    </div>

    <div class="dashboard-shell">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i data-lucide="radio" class="sidebar-logo-icon"></i>
                <span class="sidebar-logo-text">ProxVN CC</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard/" class="sidebar-link">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Tổng quan</span>
                </a>
                <a href="users.html" class="sidebar-link active">
                    <i data-lucide="users"></i>
                    <span>Người dùng</span>
                </a>
                <a href="#how-it-works" class="sidebar-link" id="sidebarShortcutsBtn">
                    <i data-lucide="keyboard"></i>
                    <span>Phím tắt</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <i data-lucide="user" class="user-avatar-icon"></i>
                    <div>
                        <strong id="userDisplayName">TrongDev</strong>
                        <span id="userDisplayRole">Admin</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()" title="Đăng xuất">
                    <i data-lucide="log-out"></i>
                    <span>Đăng xuất</span>
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="workspace">
            <header class="topbar animate-fade-in">
                <div class="topbar-left">
                    <button class="search-trigger-btn" id="searchTriggerBtn">
                        <i data-lucide="search"></i>
                        <span>Tìm nhanh... (Ctrl + K)</span>
                    </button>
                </div>
                <div class="topbar-actions">
                    <div class="connection-pill" id="connectionStatus" role="status" aria-live="polite">
                        <span class="pill-indicator"></span>
                        <span class="pill-label">Đang kết nối...</span>
                    </div>
                    <button class="theme-toggle ghost-btn" id="themeToggle" type="button" aria-label="Chuyển theme">
                        <i data-lucide="moon" class="moon-icon"></i>
                        <i data-lucide="sun" class="sun-icon" style="display:none;"></i>
                    </button>
                </div>
            </header>

            <main class="layout-grid" style="grid-template-columns: 1fr;">
                <section class="panel">
                    <div class="panel-header" style="align-items: center;">
                        <div>
                            <h2 class="panel-title">Danh sách người dùng</h2>
                            <p class="panel-meta" style="margin-top: 4px;">Quản lý tài khoản truy cập hệ thống</p>
                        </div>
                        <button class="btn-primary" onclick="openCreateUserModal()" style="padding: 10px 20px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
                            <i data-lucide="plus" style="width: 16px; height: 16px;"></i> Thêm người dùng
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Quyền hạn</th>
                                    <th>Ngày tạo</th>
                                    <th class="actions-cell">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="usersList"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Create User Modal -->
    <div id="createUserModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Thêm thành viên mới</h3>
            <form id="createUserForm">
                <div class="form-group">
                    <label for="modalUsername">Username</label>
                    <input type="text" id="modalUsername" name="username" required placeholder="Nhập tên đăng nhập">
                </div>
                <div class="form-group">
                    <label for="modalEmail">Email</label>
                    <input type="email" id="modalEmail" name="email" required placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label for="modalPassword">Mật khẩu</label>
                    <input type="password" id="modalPassword" name="password" required placeholder="Nhập mật khẩu truy cập">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-link" onclick="closeCreateUserModal()">Hủy bỏ</button>
                    <button type="submit" class="btn-primary" style="padding: 10px 22px;">Tạo tài khoản</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/admin/users`, {
                    headers: {
                        ...authHeader(),
                        'X-Timestamp': new Date().toISOString()
                    }
                });
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                renderUsers(data.data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersList');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>
                        <div style="font-weight:600;">${u.username}</div>
                        <div style="font-size:0.75rem; color:var(--color-text-muted); margin-top:2px;">${u.id}</div>
                    </td>
                    <td>${u.email}</td>
                    <td><span class="badge-role badge-${u.role}">${u.role}</span></td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="actions-cell">
                        <button class="btn-link btn-sm" style="color:var(--accent-danger); border-color: rgba(249,115,22,0.2);" onclick="deleteUser('${u.id}')">
                            <i data-lucide="trash-2" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;"></i> Xóa
                        </button>
                    </td>
                </tr>
            `).join('');
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        const modal = document.getElementById('createUserModal');
        function openCreateUserModal() { modal.classList.add('open'); }
        function closeCreateUserModal() { modal.classList.remove('open'); }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.role = 'user';

            try {
                const res = await fetch(`${API_BASE}/admin/users`, {
                    method: 'POST',
                    headers: {
                        ...authHeader(),
                        'Content-Type': 'application/json',
                        'X-Timestamp': new Date().toISOString()
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    closeCreateUserModal();
                    loadUsers();
                    e.target.reset();
                    showToast('Tạo người dùng thành công!', 'success');
                } else {
                    const err = await res.json();
                    alert(err.error);
                }
            } catch (error) {
                alert('Lỗi kết nối');
            }
        });

        async function deleteUser(id) {
            if (!confirm('Bạn có chắc muốn xóa user này?')) return;
            try {
                const res = await fetch(`${API_BASE}/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: {
                        ...authHeader(),
                        'X-Timestamp': new Date().toISOString()
                    }
                });
                if (res.ok) {
                    loadUsers();
                    showToast('Đã xóa người dùng!', 'success');
                }
            } catch (e) {
                alert('Lỗi xóa user');
            }
        }
    </script>
</body>

</html>
