services:
  # ===== ProxVN Tunnel Server =====
  # Single container handles everything:
  #   8881            -> dashboard / API (internal Gin)
  #   8882            -> tunnel control (TCP-TLS) + UDP
  #   443             -> HTTPS proxy: landing + dashboard + *.<domain> tunnels
  #   10000-20000     -> public TCP/UDP tunnel ports
  # host networking is required so the full public port range and :443 are
  # reachable without per-port mappings. No nginx needed — the Go server on
  # :443 already serves the landing page, proxies the dashboard and routes
  # <sub>.<domain> to active tunnels.
  proxvn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxvn-server:latest
    container_name: proxvn-server
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./logs:/logs
      # Download binaries (bin/client/*, bin/server/*) served at /bin/*.
      # Built via build-all.sh and rsynced to the VPS; mounted read-only so
      # they can be updated without rebuilding the image.
      - ./bin:/app/bin:ro
      # Wildcard TLS certificate for *.<domain> (mounted read-only).
      # Generated on the VPS via certbot DNS-01; see docs/05-deployment.md.
      - ./ssl/wildcard.crt:/app/wildcard.crt:ro
      - ./ssl/wildcard.key:/app/wildcard.key:ro
      # Tunnel-control (:8882) self-signed cert. Persisted so the client
      # cert-pin (cert-pin.txt) stays stable across container recreation.
      - ./ssl/server.crt:/app/server.crt:ro
      - ./ssl/server.key:/app/server.key:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8881/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===== Monitoring (optional) =====
  # Enable with:  docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: proxvn-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: proxvn-grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:
