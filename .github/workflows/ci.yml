name: ProxVN CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Go Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: src/backend/go.sum

      - name: Run Go Vet
        run: |
          cd src/backend
          go vet ./...

      - name: Run Go Tests
        run: |
          cd src/backend
          go test -race -v -timeout 5m ./...

      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25.x'
          work-dir: 'src/backend'
          repo-checkout: false

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -exclude=G104 ./src/backend/...

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Dockerfile Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: proxvn-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
